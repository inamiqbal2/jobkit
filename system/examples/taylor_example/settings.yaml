  role_types: ["lineman|linemen", "meter readers?", "recruit(er|ers|ing|ment)", "sales engineers?"]
  contract_work: false
  postdocs: false

salary:
  floor: 95000
  target: 125000
  currency: "USD"

modules:
  inbox_sweep: false
  outreach: false

run:
  adzuna: false
  linkedin_guest: true
  indeed_jobspy: false
  window_days: 30

build:
  resume_filename: "Resume_Taylor_Example.docx"
  min_experience_entries: 3
  location_line_default: "Open to relocation"

education:
  - institution: "Example State University"
    dates: "Aug 2020 - May 2022"
    line: "M.S. in Electrical Engineering (Power Systems), Fort Collins, CO  |  Thesis: Hosting-capacity estimation for distribution feeders with high rooftop-solar penetration"
  - institution: "Example State University"
    dates: "Aug 2016 - May 2020"
