  tier2_regex: "Salt Lake|\\bUT\\b|Albuquerque|\\bNM\\b|Phoenix|\\bAZ\\b|Kansas City|Omaha|\\bNE\\b"

lanes:
  - name: "power-systems"
    description: "Transmission and distribution planning, protection coordination and interconnection studies for a utility or ISO"
    example_titles: ["Power Systems Engineer", "Transmission Planning Engineer", "Protection Engineer", "Interconnection Engineer"]
    never_claims: ["PE license", "NERC-certified operator", "SCADA administration"]
    priority: false
    packs: []
  - name: "grid-analytics"
    description: "Data analysis and software for grid operations: load forecasting, outage analytics, DER hosting-capacity studies in Python and SQL"
    example_titles: ["Grid Analytics Engineer", "Energy Data Scientist", "Power Systems Software Engineer"]
    never_claims: ["PyTorch", "TensorFlow", "Kubernetes"]
    priority: true
    packs: ["deeptech_other"]
  - name: "test-engineering"
    description: "Test planning and execution for electrical equipment and grid-edge devices (inverters, relays, meters)"
    example_titles: ["Test Engineer", "Hardware Test Engineer", "Validation Engineer"]
    never_claims: ["UL certification authority", "RF compliance testing"]
    priority: false
    packs: []

thresholds:
  build_default_min_rubric: 60
  commutable_min_rubric: 45
  auto_skip_below_rubric: 40
  jd_gate: 0.28
  band_midpoint_ceiling: null
  low_band_top: 85000

